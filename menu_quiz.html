<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocos Lounge — Quiz меню</title>
<style>
:root{
  --bg:#0f0f13; --card:#1b1b22; --card2:#22222b; --border:#33333d;
  --accent:#d4af37; --accent2:#982729; --text:#f2f0ea; --muted:#9a97a3;
  --green:#2ecc71; --red:#e74c3c; --blue:#5b9bd5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
header{position:sticky;top:0;z-index:50;background:rgba(15,15,19,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:14px 18px}
header .wrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.5px;font-size:20px}
.logo span{color:var(--accent)}
header .tag{font-size:12px;color:var(--muted)}
.container{max-width:1100px;margin:0 auto;padding:20px 18px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:9px 16px;border-radius:30px;border:1px solid var(--border);background:var(--card);
  cursor:pointer;font-size:14px;color:var(--muted);transition:.15s;white-space:nowrap}
.tab:hover{color:var(--text);border-color:#555}
.tab.active{background:var(--accent);color:#16150f;border-color:var(--accent);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filters .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
select,.chip{padding:8px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card);
  color:var(--text);font-size:13px;cursor:pointer;outline:none}
select option{background:var(--card)}
.chip{cursor:pointer;transition:.15s}
.chip.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;
  text-align:center;min-width:90px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat.good .n{color:var(--green)} .stat.bad .n{color:var(--red)} .stat.tot .n{color:var(--accent)}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;
  max-width:720px;margin:0 auto 18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.q-section{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.q-category{font-size:11px;color:var(--muted);margin-bottom:14px}
.q-question{font-size:19px;font-weight:600;line-height:1.45;margin-bottom:22px}
.q-img{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-bottom:16px;display:block}
.q-img.placeholder{height:120px;object-fit:contain;opacity:.25;background:var(--card2)}
.options{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
  cursor:pointer;font-size:15px;transition:.12s;text-align:left;color:var(--text)}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt.correct{background:rgba(46,204,113,.15);border-color:var(--green);color:var(--green)}
.opt.wrong{background:rgba(231,76,60,.15);border-color:var(--red);color:var(--red)}
.opt.dim{opacity:.45}
.feedback{margin-top:16px;font-size:14px;line-height:1.5;padding:14px;border-radius:10px;display:none}
.feedback.good{display:block;background:rgba(46,204,113,.1);border:1px solid var(--green)}
.feedback.bad{display:block;background:rgba(231,76,60,.1);border:1px solid var(--red)}
.feedback .ans{font-weight:700;color:var(--accent)}
.textinput{display:flex;gap:10px;margin-top:16px}
.textinput input{flex:1;padding:13px 16px;border-radius:12px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:15px;outline:none}
.textinput input:focus{border-color:var(--accent)}
.textinput .submit{background:var(--accent);color:#16150f;border-color:var(--accent);font-weight:700}
.next-btn{display:none;margin:18px auto 0;padding:12px 28px;border-radius:30px;border:none;
  background:var(--accent);color:#16150f;font-size:15px;font-weight:700;cursor:pointer}
.next-btn.show{display:block}
.flashcard{max-width:720px;margin:0 auto;perspective:1200px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;min-height:420px;transform-style:preserve-3d;transition:transform .5s}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--border);
  padding:26px 24px 44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;overflow:hidden}
.fc-front{background:var(--card)}
.fc-back{background:linear-gradient(160deg,#241b10,#1b1b22);transform:rotateY(180deg)}
.fc-name{font-size:22px;font-weight:700;margin-bottom:12px;line-height:1.3}
.fc-img{width:100%;max-height:170px;object-fit:cover;border-radius:12px;margin-bottom:14px}
.fc-img.placeholder{height:90px;object-fit:contain;opacity:.25;background:var(--card2)}
.fc-price{font-size:18px;color:var(--accent);font-weight:700;margin-bottom:14px}
.fc-desc{font-size:13.5px;color:#d8d4cc;line-height:1.55;max-width:560px;overflow-y:auto}
.fc-hint{position:absolute;bottom:18px;font-size:11px;color:var(--muted)}
.fc-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;max-width:720px;margin-left:auto;margin-right:auto}
.btn{padding:12px 22px;border-radius:30px;border:1px solid var(--border);background:var(--card);
  color:var(--text);font-size:14px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.know{background:var(--green);color:#0b1f12;border-color:var(--green)}
.btn.dont{background:var(--red);color:#fff;border-color:var(--red)}
.btn.prev{background:transparent}
.progress{max-width:720px;margin:0 auto 12px;font-size:12px;color:var(--muted);text-align:center}
.bar{max-width:720px;margin:0 auto 16px;height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:width .3s}
.end{max-width:720px;margin:0 auto;text-align:center;padding:40px 20px}
.end h2{font-size:26px;margin-bottom:10px}
.end p{color:var(--muted);margin-bottom:20px}
.hidden{display:none!important}
@media(max-width:600px){.fc-name{font-size:18px}.q-question{font-size:16px}.fc-inner{min-height:400px}.fc-img{max-height:140px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo">Cocos <span>Lounge</span></div>
  <div class="tag">Quiz-карточки · состав меню · Московский пр-т 183-185</div>
</div></header>
<div class="container">
  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="quiz">Тест (выбор ответа)</div>
    <div class="tab" data-mode="flash">Карточки (заучивание)</div>
    <div class="tab" data-mode="browse">Справочник меню</div>
  </div>

  <div class="filters">
    <span class="lbl">Категория:</span>
    <select id="catFilter"></select>
    <span class="lbl">Раздел:</span>
    <select id="secFilter"></select>
  </div>

  <div class="stats hidden" id="stats">
    <div class="stat tot"><div class="n" id="sTotal">0</div><div class="l">Всего</div></div>
    <div class="stat good"><div class="n" id="sGood">0</div><div class="l">Верно</div></div>
    <div class="stat bad"><div class="n" id="sBad">0</div><div class="l">Ошибки</div></div>
    <div class="stat"><div class="n" id="sPct">0%</div><div class="l">Точность</div></div>
  </div>

  <div class="bar hidden" id="bar"><div id="barFill"></div></div>
  <div class="progress hidden" id="progress"></div>

  <!-- QUIZ -->
  <div id="quizArea">
    <div class="quiz-card" id="quizCard">
      <div class="q-section" id="qSection"></div>
      <div class="q-category" id="qCategory"></div>
      <img class="q-img hidden" id="qImg" alt="" loading="lazy">
      <div class="q-question" id="qQuestion"></div>
      <div class="options" id="qOptions"></div>
      <div class="textinput hidden" id="qTextWrap">
        <input type="text" id="qTextInput" placeholder="Введите название позиции…" autocomplete="off">
        <button class="btn submit" id="qTextSubmit">Проверить</button>
      </div>
      <div class="feedback" id="qFeedback"></div>
      <button class="next-btn" id="qNext">Далее →</button>
    </div>
  </div>

  <!-- FLASH -->
  <div id="flashArea" class="hidden">
    <div class="flashcard" id="flashCard">
      <div class="fc-inner" id="fcInner">
        <div class="fc-face fc-front">
          <div class="fc-hint">Нажмите, чтобы перевернуть</div>
          <img class="fc-img hidden" id="fcImg" alt="" loading="lazy">
          <div class="fc-name" id="fcName"></div>
          <div class="fc-price" id="fcPrice"></div>
        </div>
        <div class="fc-face fc-back">
          <img class="fc-img hidden" id="fcImgBack" alt="" loading="lazy">
          <div class="fc-name" id="fcNameBack"></div>
          <div class="fc-price" id="fcPriceBack"></div>
          <div class="fc-desc" id="fcDesc"></div>
          <div class="fc-hint">Нажмите, чтобы вернуть</div>
        </div>
      </div>
    </div>
    <div class="fc-actions">
      <button class="btn prev" id="fcPrev">← Назад</button>
      <button class="btn dont" id="fcDont">Ещё не знаю</button>
      <button class="btn know" id="fcKnow">Знаю ✓</button>
    </div>
  </div>

  <!-- BROWSE -->
  <div id="browseArea" class="hidden">
    <div id="browseList"></div>
  </div>
</div>

гкие ноты тимьяна и тёплый пряный акцент корицы. Пищевая ценность на порцию: 368 ккал · Б 9 г · Ж 24 г · У 27 г","image":"https://static.tildacdn.com/tild6666-3431-4462-a438-646130363461/_-__.PNG"},{"section":"Осеннее меню","category":"Кухня","name":"Лепёшка роти с креветками и манго","price":"280 г · 720 ₽","desc":"Хрустящая лепёшка роти с креветками, авокадо, свежим манго и томатами. Творожный сыр и лимонный сок добавляют мягкость и свежесть, а красный лук, кинза и чесночное масло делают вкус более выразительным. Пищевая ценность на порцию: 473 ккал · Б 14 г · Ж 24 г · У 48 г","image":"https://static.tildacdn.com/tild3939-6436-4535-b137-363634333166/_____.PNG"},{"section":"Осеннее меню","category":"Кухня","name":"Поке с лососем","price":"390 г · 1050 ₽","desc":"Поке с лососем, рисом, авокадо, томатами черри и свежим огурцом. Цитрусовый соус добавляет лёгкую кислинку и делает вкус более свежим. Пищевая ценность на порцию: 467 ккал · Б 19 г · Ж 20 г · У 52 г","image":"https://static.tildacdn.com/tild3139-3335-4265-b136-333366666133/__.PNG"},{"section":"Осеннее меню","category":"Кухня","name":"Лосось с бобами эдамаме и сливочным соусом","price":"300 г · 1990 ₽","desc":"Филе лосося с бобами эдамаме в насыщенном сливочном соусе на рыбном бульоне. Унаги и сладкий чили добавляют мягкую сладость и глубину вкуса, а масло базилика и малиновая пудра — свежие акценты. Пищевая ценность на порцию: 888 ккал · Б 37 г · Ж 65 г · У 36 г","image":"https://static.tildacdn.com/tild3866-6231-4938-b961-333166316132/______.PNG"},{"section":"Осеннее меню","category":"Кухня","name":"Удон с говядиной и соусом том-ям","price":"350 г · 920 ₽","desc":"Удон с говядиной, овощами и шампиньонами в насыщенном соусе на основе кокосового молока и пасты том-ям. Лист лайма, кинза и чили добавляют характерные цитрусово-пряные ноты и лёгкую остроту. Пищевая ценность на порцию: 666 ккал · Б 25 г · Ж 22 г · У 90 г","image":"https://static.tildacdn.com/tild3536-3563-4336-b533-653864373261/_____-.JPG"},{"sec const state = {
  mode: 'quiz',
  category: 'all',
  section: 'all',
  filtered: [],
  // quiz
  qIndex: 0, qOrder: [], qGood: 0, qBad: 0, answered: false,
  qtOrder: ['price','composition','name'], currentQuestion: null,
  // flash
  fIndex: 0, fOrder: [], fKnown: new Set(), fUnknown: new Set(),
};

const $ = s => document.querySelector(s);

// Save the original card structures so we can restore them after "end" screens
const QUIZ_TEMPLATE = $('#quizCard').innerHTML;
const FLASH_TEMPLATE = $('#flashCard').innerHTML;

function categories(){
  const set = new Set(MENU_DATA.map(p => p.category));
  return ['all', ...set];
}
function sections(){
  const set = new Set(MENU_DATA.map(p => p.section));
  return ['all', ...set];
}

function applyFilters(){
  state.filtered = MENU_DATA.filter(p =>
    (state.category==='all' || p.category===state.category) &&
    (state.section==='all' || p.section===state.section)
  );
}

function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function buildFilters(){
  const cf = $('#catFilter'); cf.innerHTML='';
  categories().forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    o.textContent = c==='all' ? 'Все категории' : c;
    cf.appendChild(o);
  });
  cf.value = state.category;
  const sf = $('#secFilter'); sf.innerHTML='';
  sections().forEach(s=>{
    const o=document.createElement('option'); o.value=s;
    o.textContent = s==='all' ? 'Все разделы' : s;
    sf.appendChild(o);
  });
  sf.value = state.section;
}

function renderMode(){
  $('#quizArea').classList.toggle('hidden', state.mode!=='quiz');
  $('#flashArea').classList.toggle('hidden', state.mode!=='flash');
  $('#browseArea').classList.toggle('hidden', state.mode!=='browse');
  $('#stats').classList.toggle('hidden', state.mode==='browse');
  $('#bar').classList.toggle('hidden', state.mode==='browse');
  $('#progress').classList.toggle('hidden', state.mode==='browse');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.mode===state.mode));
}

// ---------- QUIZ ----------
function startQuiz(){
  applyFilters();
  // restore card structure if it was replaced by the "end" screen
  if(!$('#qQuestion')){ $('#quizCard').innerHTML = QUIZ_TEMPLATE; }
  if(!state.filtered.length){ $('#quizCard').innerHTML='<p style="text-align:center;color:var(--muted)">Нет позиций в выбранном фильтре.</p>'; return; }
  state.qOrder = shuffle(state.filtered.map((_,i)=>i));
  state.qIndex = 0; state.qGood = 0; state.qBad = 0;
  renderQuiz();
}

function renderQuiz(){
  const n = state.qOrder.length;
  if(state.qIndex >= n){ renderQuizEnd(); return; }
  const idx = state.qOrder[state.qIndex];
  const item = state.filtered[idx];
  state.answered = false;
  $('#qSection').textContent = item.section;
  $('#qCategory').textContent = item.category;
  setImg($('#qImg'), item.image);
  const q = buildQuestion(item);
  state.currentQuestion = q;
  $('#qQuestion').textContent = q.text;
  // options area
  const odiv = $('#qOptions'); odiv.innerHTML='';
  const tw = $('#qTextWrap'); const ti = $('#qTextInput');
  tw.classList.add('hidden');
  if(q.type === 'name'){
    // text input mode
    tw.classList.remove('hidden');
    ti.value = '';
    ti.disabled = false;
    ti.focus();
  } else {
    q.options.forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=o;
      b.onclick=()=>answerChoice(b, o, item, q);
      odiv.appendChild(b);
    });
  }
  $('#qFeedback').className='feedback'; $('#qFeedback').innerHTML='';
  $('#qNext').classList.remove('show');
  updateStats();
  $('#barFill').style.width = ((state.qIndex)/n*100)+'%';
  $('#progress').textContent = 'Вопрос '+(state.qIndex+1)+' из '+n;
}

// Build one of three question types for a given item
function buildQuestion(item){
  let type = state.qtOrder[state.qIndex % state.qtOrder.length];
  // composition/name questions need a description; fall back to price if missing
  if((type === 'composition' || type === 'name') && !item.desc) type = 'price';
  if(type === 'price'){
    return {
      type:'price',
      text:'Какова цена позиции «'+item.name+'»?',
      correct:item.price,
      options: (()=>{
        const s = new Set([item.price]);
        const pool = state.filtered.filter(p=>p.price!==item.price);
        shuffle(pool).slice(0,3).forEach(p=>s.add(p.price));
        const a=[...s]; while(a.length<4 && pool.length) a.push(shuffle(pool)[0].price);
        return shuffle([...new Set(a)].slice(0,4));
      })(),
      explain: '«'+item.name+'» — '+item.price,
      extra: item.desc
    };
  }
  if(type === 'composition'){
    const pool = state.filtered.filter(p=>p.name!==item.name && p.desc);
    return {
      type:'composition',
      text:'Какому блюду соответствует описание? «'+item.desc+'»',
      correct:item.name,
      options: (()=>{
        const s = new Set([item.name]);
        shuffle(pool).slice(0,3).forEach(p=>s.add(p.name));
        const a=[...s]; while(a.length<4 && pool.length) a.push(shuffle(pool)[0].name);
        return shuffle([...new Set(a)].slice(0,4));
      })(),
      explain:'Правильный ответ: «'+item.name+'» ('+item.price+')',
      extra: item.desc
    };
  }
  // 'name' — write the name from description
  return {
    type:'name',
    text:'Напишите название позиции по описанию: «'+item.desc+'»',
    correct:item.name,
    explain:'Правильный ответ: «'+item.name+'» ('+item.price+')',
    extra: ''
  };
}

function answerChoice(btn, chosen, item, q){
  if(state.answered) return;
  state.answered = true;
  const correct = chosen===q.correct;
  if(correct) state.qGood++; else state.qBad++;
  document.querySelectorAll('.opt').forEach(b=>{
    b.style.pointerEvents='none';
    if(b.textContent===q.correct) b.classList.add('correct');
    else b.classList.add('dim');
  });
  if(!correct) btn.classList.add('wrong');
  const fb = $('#qFeedback');
  fb.className = 'feedback '+(correct?'good':'bad');
  fb.innerHTML = (correct?'<b>Верно!</b> ':'<b>Неверно.</b> ') + q.explain +
    (q.extra ? '<br><span style="color:var(--muted)">'+q.extra+'</span>' : '');
  $('#qNext').classList.add('show');
  updateStats();
}

function answerName(){
  if(state.answered) return;
  const item = state.filtered[state.qOrder[state.qIndex]];
  const q = state.currentQuestion;
  const val = $('#qTextInput').value;
  if(!val.trim()) return;
  state.answered = true;
  const correct = normalize(val) === normalize(q.correct);
  if(correct) state.qGood++; else state.qBad++;
  $('#qTextInput').disabled = true;
  const fb = $('#qFeedback');
  fb.className = 'feedback '+(correct?'good':'bad');
  fb.innerHTML = (correct?'<b>Верно!</b> ':'<b>Неверно.</b> Вы написали «'+val.trim()+'». ') + q.explain +
    (q.extra ? '<br><span style="color:var(--muted)">'+q.extra+'</span>' : '');
  $('#qNext').classList.add('show');
  updateStats();
}

function normalize(s){
  return s.toLowerCase()
    .replace(/ё/g,'е')
    .replace(/[^a-zа-я0-9]/g,'')
    .replace(/\s+/g,'');
}

// Apply an image URL to an <img> element; hides it (shows placeholder) if missing
function setImg(el, url, placeholderCls){
  if(!el) return;
  if(url){
    el.classList.remove('hidden');
    el.classList.remove('placeholder');
    el.src = url;
    el.alt = '';
  } else {
    el.classList.add('hidden');
  }
}

function renderQuizEnd(){
  const n = state.qOrder.length;
  const pct = n? Math.round(state.qGood/n*100):0;
  $('#quizCard').innerHTML =
    '<div class="end"><h2>Готово! 🎉</h2><p>Верно: <b style="color:var(--green)">'+state.qGood+'</b> · '+
    'Ошибки: <b style="color:var(--red)">'+state.qBad+'</b> · Точность: <b style="color:var(--accent)">'+pct+'%</b></p>'+
    '<button class="btn" data-restart="quiz">Пройти ещё раз</button></div>';
  $('#barFill').style.width='100%';
}

// ---------- FLASH ----------
function startFlash(){
  applyFilters();
  if(!$('#fcInner')){ $('#flashCard').innerHTML = FLASH_TEMPLATE; }
  if(!state.filtered.length){ $('#flashCard').innerHTML='<p style="text-align:center;color:var(--muted)">Нет позиций.</p>'; return; }
  state.fOrder = shuffle(state.filtered.map((_,i)=>i));
  state.fIndex = 0; state.fKnown=new Set(); state.fUnknown=new Set();
  renderFlash();
}

function renderFlash(){
  const n = state.fOrder.length;
  if(state.fIndex>=n){ renderFlashEnd(); return; }
  const item = state.filtered[state.fOrder[state.fIndex]];
  $('#fcInner').classList.remove('flipped');
  setImg($('#fcImg'), item.image);
  setImg($('#fcImgBack'), item.image);
  $('#fcName').textContent = item.name;
  $('#fcPrice').textContent = '';
  $('#fcNameBack').textContent = item.name;
  $('#fcPriceBack').textContent = item.price;
  $('#fcDesc').textContent = item.desc || 'Описание отсутствует.';
  $('#barFill').style.width = (state.fIndex/n*100)+'%';
  $('#progress').textContent = 'Карточка '+(state.fIndex+1)+' из '+n;
  updateStats();
}

function renderFlashEnd(){
  $('#flashCard').innerHTML='<div class="end"><h2>Готово! 🎉</h2><p>Знаю: <b style="color:var(--green)">'+state.fKnown.size+
    '</b> · Повторить: <b style="color:var(--red)">'+state.fUnknown.size+'</b></p>'+
    '<button class="btn" data-restart="flash">Начать заново</button></div>';
}

// ---------- BROWSE ----------
function renderBrowse(){
  applyFilters();
  const list = $('#browseList'); list.innerHTML='';
  if(!state.filtered.length){ list.innerHTML='<p style="color:var(--muted)">Нет позиций.</p>'; return; }
  const grouped = {};
  state.filtered.forEach(p=>{
    (grouped[p.section] = grouped[p.section]||[]).push(p);
  });
  Object.keys(grouped).sort().forEach(sec=>{
    const h=document.createElement('h3');
    h.style.cssText='color:var(--accent);margin:22px 0 10px;font-size:17px;border-bottom:1px solid var(--border);padding-bottom:6px';
    h.textContent=sec+' ('+grouped[sec].length+')';
    list.appendChild(h);
    grouped[sec].forEach(p=>{
      const d=document.createElement('div');
      d.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start';
      const imgHtml = p.image
        ? '<img src="'+p.image+'" loading="lazy" style="width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0">'
        : '<div style="width:72px;height:72px;border-radius:8px;flex-shrink:0;background:var(--card2);opacity:.3"></div>';
      d.innerHTML = imgHtml +
        '<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>'+p.name+'</b><span style="color:var(--accent);white-space:nowrap">'+p.price+'</span></div>'+
        (p.desc?'<div style="font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45">'+p.desc+'</div>':'')+'</div>';
      list.appendChild(d);
    });
  });
}

// ---------- STATS ----------
function updateStats(){
  if(state.mode==='quiz'){
    const done = state.qGood+state.qBad;
    $('#sTotal').textContent = state.qOrder.length;
    $('#sGood').textContent = state.qGood;
    $('#sBad').textContent = state.qBad;
    $('#sPct').textContent = done? Math.round(state.qGood/done*100)+'%' : '0%';
  } else if(state.mode==='flash'){
    const done = state.fKnown.size+state.fUnknown.size;
    const total = state.fOrder.length;
    $('#sTotal').textContent = total;
    $('#sGood').textContent = state.fKnown.size;
    $('#sBad').textContent = state.fUnknown.size;
    $('#sPct').textContent = done? Math.round(state.fKnown.size/done*100)+'%' : '0%';
  }
}

// ---------- EVENTS ----------
$('#tabs').addEventListener('click', e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  state.mode = t.dataset.mode;
  renderMode();
  if(state.mode==='quiz') startQuiz();
  else if(state.mode==='flash') startFlash();
  else renderBrowse();
});

$('#catFilter').addEventListener('change', e=>{ state.category=e.target.value; onFilterChange(); });
$('#secFilter').addEventListener('change', e=>{ state.section=e.target.value; onFilterChange(); });

function onFilterChange(){
  if(state.mode==='quiz') startQuiz();
  else if(state.mode==='flash') startFlash();
  else renderBrowse();
}

// Event delegation — survives element re-creation (end screens replace innerHTML)
document.addEventListener('click', e=>{
  if(e.target.closest('#qNext')){ state.qIndex++; renderQuiz(); return; }
  if(e.target.closest('#qTextSubmit')){ answerName(); return; }
  if(e.target.closest('#fcKnow')){ state.fKnown.add(state.fOrder[state.fIndex]); state.fIndex++; renderFlash(); return; }
  if(e.target.closest('#fcDont')){ state.fUnknown.add(state.fOrder[state.fIndex]); state.fIndex++; renderFlash(); return; }
  if(e.target.closest('#fcPrev')){ if(state.fIndex>0){ state.fIndex--; renderFlash(); } return; }
  if(e.target.closest('#flashCard') && e.target.closest('#fcInner')){
    // toggle flip only if not clicking a button
    if(!e.target.closest('button')) $('#fcInner').classList.toggle('flipped');
  }
});

// "Пройти ещё раз" / "Начать заново" buttons rendered inside end screens
document.addEventListener('click', e=>{
  if(e.target.closest('[data-restart="quiz"]')){ startQuiz(); }
  if(e.target.closest('[data-restart="flash"]')){ startFlash(); }
});

// Enter key submits the name-input answer
document.addEventListener('keydown', e=>{
  if(e.code==='Enter' && e.target && e.target.id==='qTextInput'){ e.preventDefault(); answerName(); }
});

// keyboard
document.addEventListener('keydown', e=>{
  if(state.mode==='flash'){
    if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); $('#fcInner').classList.toggle('flipped'); }
    if(e.code==='ArrowLeft'){ if(state.fIndex>0){state.fIndex--;renderFlash();} }
    if(e.code==='ArrowRight'){ state.fKnown.add(state.fOrder[state.fIndex]); state.fIndex++; renderFlash(); }
    if(e.code==='KeyX'){ state.fUnknown.add(state.fOrder[state.fIndex]); state.fIndex++; renderFlash(); }
  }
});

// init
buildFilters();
startQuiz();
</script>
</body>
</html>
